name: CI - BandManager Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run GUT Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Import project resources
        run: |
          godot --headless --path . --import 2>&1 | tail -20 || true

      - name: Run GUT tests
        run: |
          godot --headless --path . \
          -s addons/gut/gut_cmdln.gd \
          -gdir=res://tests/ \
          -gprefix=test_ \
          -gsuffix=.gd \
          -gexit \
          -glog=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '*.log'