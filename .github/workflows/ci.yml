name: CI - BandManager Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run GUT Tests
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-imports-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd') }}
          restore-keys: godot-imports-

      - name: Import project resources
        run: godot --headless --path . --import || true
        timeout-minutes: 10

      - name: Run GUT tests
        run: |
          godot --headless --path . \
          -s addons/gut/gut_cmdln.gd \
          -gdir=res://tests/ \
          -gprefix=test_ \
          -gsuffix=.gd \
          -gexit \
          -glog=1
        timeout-minutes: 10